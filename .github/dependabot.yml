version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The MSRV job pins this action to the minimum supported Rust version on purpose.
      # Bumping it would silently raise the MSRV instead of testing it.
      - dependency-name: "dtolnay/rust-toolchain"
