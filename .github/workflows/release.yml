name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build binaries for
        required: true

# Least privilege by default; only the job that uploads assets asks for write.
permissions:
  contents: read

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf backcheck-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release backcheck

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/backcheck.exe `
            -DestinationPath backcheck-${{ matrix.target }}.zip

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            backcheck-${{ matrix.target }}.tar.gz
            backcheck-${{ matrix.target }}.zip
          fail_on_unmatched_files: false
          generate_release_notes: true

  crates-io:
    name: publish to crates.io
    needs: binaries
    runs-on: ubuntu-latest
    # Only a v* tag can reach this job. The `crates-io` environment additionally restricts
    # itself to v* tags and requires a reviewer to approve, so the publish token is
    # unreachable from a branch, a pull request, or a fork.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      # Cargo reads CARGO_REGISTRY_TOKEN from the environment. Passing it as a `--token`
      # argument instead would expose it in the process list of the runner.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "No publish token available; skipping."
            exit 0
          fi
          cargo publish
