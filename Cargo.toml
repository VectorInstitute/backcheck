[package]
name = "backcheck"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Verify what your coding agent actually did. Checks an agent's claims against the evidence in its own session transcript."
authors = ["Vector Institute"]
license = "Apache-2.0"
repository = "https://github.com/VectorInstitute/backcheck"
homepage = "https://github.com/VectorInstitute/backcheck"
documentation = "https://github.com/VectorInstitute/backcheck#readme"
readme = "README.md"
keywords = ["claude-code", "agent", "verification", "testing", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = ["tests/fixtures/*", ".github/*"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwinding is kept deliberately: hook mode catches panics so that a bug here can never
# interrupt someone's Claude Code session.
panic = "unwind"
