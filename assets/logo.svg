<svg width="730" height="190" viewBox="0 0 730 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!--
      Palette: the verdict colours backcheck actually prints.

        emerald #10B981   supported   evidence backs the claim
        amber   #F59E0B   qualified   a real pass that does not mean what was claimed
        red     #EF4444   unsupported nothing backs it
        slate   #64748B   the transcript itself

      All four are mid-tone, so they hold up on a light and a dark README alike.

      Concept: the check mark is the claim. It is drawn in emerald only as far as the
      evidence reaches, then turns amber and finally red where it outruns the record.
      Below it the session runs left to right, and the tracer sweeps it right to left,
      the direction backcheck reads: the claim comes last, the proof is behind it.
    -->

    <path id="check" d="M74,88 L108,126 L196,34"/>
    <path id="timeline" d="M276,156 L58,156"/>

    <!--
      Stops sit where they do for a reason: the short descending stroke and the start of
      the rise are green, the doubt begins past the midpoint, and only the tip is red.
    -->
    <linearGradient id="claim" x1="74" y1="126" x2="196" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#10B981"/>
      <stop offset="46%"  stop-color="#10B981"/>
      <stop offset="68%"  stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="word" x1="352" y1="0" x2="672" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#10B981"/>
      <stop offset="62%"  stop-color="#0EA5A5"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <radialGradient id="ambient" cx="150" cy="92" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="tracer" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&amp;display=swap');
    </style>
  </defs>

  <rect width="730" height="190" rx="16" fill="url(#ambient)"/>

  <!-- ── The claim ──────────────────────────────────────────────────── -->

  <use href="#check" stroke="url(#claim)" stroke-width="15" fill="none"
       stroke-linecap="round" stroke-linejoin="round" opacity="0.14"/>

  <use href="#check" stroke="url(#claim)" stroke-width="13.5" fill="none"
       stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- The unsupported tip, pulsing so the eye lands on the part that is not backed -->
  <path d="M178,52 L196,34" stroke="#EF4444" stroke-width="13.5" fill="none"
        stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- What that part of the claim was supposed to rest on -->
  <path d="M152,148 L186,50" stroke="#EF4444" stroke-width="1.5" fill="none"
        stroke-dasharray="3 6" opacity="0.55"/>

  <!-- ── The transcript, read backwards ─────────────────────────────── -->

  <use href="#timeline" stroke="#64748B" stroke-width="2" fill="none"
       stroke-linecap="round" opacity="0.55"/>

  <polyline points="69,148 58,156 69,164" fill="none" stroke="#64748B"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Steps the evidence covers -->
  <circle cx="86"  cy="156" r="3.4" fill="#10B981" filter="url(#soft)" opacity="0.9"/>
  <circle cx="119" cy="156" r="3.4" fill="#10B981" filter="url(#soft)" opacity="0.9"/>
  <circle cx="196" cy="156" r="3.4" fill="#10B981" filter="url(#soft)" opacity="0.9"/>
  <circle cx="229" cy="156" r="3.4" fill="#F59E0B" filter="url(#soft)" opacity="0.9"/>
  <circle cx="262" cy="156" r="3.4" fill="#10B981" filter="url(#soft)" opacity="0.9"/>

  <!-- The step nothing supports -->
  <circle cx="152" cy="156" r="9" fill="none" stroke="#EF4444" stroke-width="1.5">
    <animate attributeName="r"       values="7;16;7"    dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0;0.75" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="156" r="5" fill="#EF4444" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <circle r="4.2" fill="#38BDF8" filter="url(#tracer)">
    <animateMotion dur="3.8s" repeatCount="indefinite" rotate="none">
      <mpath href="#timeline"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.95;0.95;0.95;0"
             keyTimes="0;0.07;0.5;0.88;1" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ── Wordmark ───────────────────────────────────────────────────── -->
  <!--
    Monospace, because the whole tool lives in a terminal. The stack falls back to the
    system's UI monospace wherever the webfont cannot load, which is most of the time on
    GitHub, and the design assumes that rather than fighting it.
  -->
  <text x="352" y="112"
        font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="60" font-weight="700" letter-spacing="-2.5"
        fill="url(#word)">backcheck</text>

  <text x="355" y="142"
        font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="12.5" font-weight="400" letter-spacing="1.6"
        fill="#64748B">verify what your agent actually did</text>
</svg>
